<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inkcast">
<meta name="theme-color" content="#16181d">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="icon" href="/icon.svg">
<title>Inkcast Pad</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="pad">
<header id="bar">
  <div class="group" id="tools">
    <button data-tool="pen" class="on" title="Pen"><svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z"/><path d="M14 6.6l3.4 3.4"/></svg></button>
    <button data-tool="hl" title="Highlighter"><svg viewBox="0 0 24 24"><path d="M9 15l-3 3v2h5l2-2"/><path d="M9 15l7.6-9.6a2 2 0 0 1 2.9-.2l.3.3a2 2 0 0 1-.2 2.9L10 16z"/><path d="M4 21h16" opacity=".5"/></svg></button>
    <button data-tool="eraser" title="Eraser"><svg viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M4.6 15.4l9.8-9.8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8z"/><path d="M9.4 10.6l5 5"/></svg></button>
  </div>
  <div class="group" id="colors"></div>
  <div class="group" id="widths">
    <button data-w="2" title="Fine"><i style="--d:4px"></i></button>
    <button data-w="3.5" class="on" title="Medium"><i style="--d:7px"></i></button>
    <button data-w="6.5" title="Bold"><i style="--d:11px"></i></button>
  </div>
  <div class="group">
    <button id="undo" title="Undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button id="redo" title="Redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  </div>
  <div class="spacer"></div>
  <div class="group" id="pager">
    <button id="prev" title="Previous page"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <span id="pageno">1 / 1</span>
    <button id="next" title="Next page"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="addpage" title="New page after this one"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="group">
    <span id="dot" title="Connection"></span>
    <button id="menubtn" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
  </div>
</header>

<div id="menu" hidden>
  <button id="openpdf">Open PDF…</button>
  <button id="newdoc">New blank notebook</button>
  <div class="sep"></div>
  <div class="row" id="papers">
    <span>Paper</span>
    <button data-paper="blank">Blank</button>
    <button data-paper="grid">Grid</button>
    <button data-paper="lines">Lines</button>
    <button data-paper="dots">Dots</button>
  </div>
  <div class="sep"></div>
  <button id="clear">Clear this page</button>
  <button id="delpage">Delete this page</button>
  <div class="sep"></div>
  <label class="row"><span>Double-tap Pencil tip: pen ↔ eraser</span><input type="checkbox" id="doubletap"></label>
  <label class="row"><span>Draw with finger too</span><input type="checkbox" id="fingerdraw"></label>
  <button id="export">Save notebook as PDF</button>
  <div class="hint">Pencil draws; tap the tip twice quickly to switch pen/eraser. One finger pans, two fingers zoom. Tip: Share › Add to Home Screen for full screen.</div>
</div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<main id="stage"></main>
<button id="fitbtn" hidden>Fit page</button>
<div id="toast" hidden></div>

<script type="module" src="/pad.js"></script>
</body>
</html>
